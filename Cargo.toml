[package]
name = "supportos-oracle-ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"

[workspace]
members = ["src-tauri"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# The create-tauri-app template keeps this in src-tauri/Cargo.toml, but cargo ignores
# profiles in non-root workspace members, so it lives here (see docs/DECISIONS.md).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
