[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "src-tauri"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Cargo ignores profiles in non-root workspace members, so the release profile
# stays in this root manifest (see docs/DECISIONS.md).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
