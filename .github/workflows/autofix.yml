name: Autofix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  autofix:
    name: Generate Cargo.lock and format the code
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Format the code
        run: cargo fmt --all

      - name: Commit and push fixes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "autofix: generate Cargo.lock and apply cargo fmt"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CI on this branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Autofix summary"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "- Cargo.lock generated and code formatted."
              echo "- Changes committed and pushed to ${GITHUB_REF_NAME}."
              echo "- CI dispatched on ${GITHUB_REF_NAME} (pushes with the workflow token do not trigger workflows themselves)."
            else
              echo "- Lockfile up to date and code already formatted; nothing to commit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
