name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install Trunk and the Tauri CLI
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: trunk@0.21.14,tauri-cli@2.12.1,cargo-machete@0.9.2,cargo-audit@0.22.2

      - name: Format check
        id: fmt
        run: cargo fmt --all --check

      - name: Check for banned comment markers
        id: comments
        run: |
          # A17 bans TODO/FIXME/XXX/HACK markers in implementation code;
          # history comments are caught by review (see docs/DECISIONS.md).
          if grep -rnE 'TODO|FIXME|XXX|HACK' --include='*.rs' crates src-tauri; then
            echo "Banned comment markers found (list above)." >&2
            exit 1
          fi

      - name: Check for unused dependencies
        id: unused
        run: cargo machete

      - name: Audit dependencies against the RustSec advisory database
        id: audit
        run: cargo audit

      - name: Lint
        id: clippy
        # shell: bash runs with -eo pipefail: without pipefail the `| tee` pipe
        # masked cargo's exit code and the step passed even when clippy failed
        # (observed in run 36878040457: the --locked lockfile error printed in
        # the log while the step stayed green).
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log

      - name: Test
        id: test
        shell: bash
        run: cargo test --all --locked 2>&1 | tee test.log

      - name: Frontend build
        id: trunk
        working-directory: crates/ui
        run: trunk build

      - name: Package (DEB)
        id: package
        run: cargo tauri build --bundles deb

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages
          # The cargo workspace root is the repo root, so tauri-bundler writes
          # the DEB into the workspace target directory, not src-tauri/target.
          # A single search path keeps the artifact flat after download.
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          FMT: ${{ steps.fmt.outcome }}
          COMMENTS: ${{ steps.comments.outcome }}
          UNUSED: ${{ steps.unused.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          TRUNK: ${{ steps.trunk.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## CI build summary"
            echo
            echo "- Job status: ${JOB_STATUS}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${RUN_URL}"
            echo
            echo "| Step | Outcome |"
            echo "| ---- | ------- |"
            echo "| \`cargo fmt --all --check\` | ${FMT} |"
            echo "| banned comment markers | ${COMMENTS} |"
            echo "| unused dependencies (cargo machete) | ${UNUSED} |"
            echo "| RustSec audit (cargo audit) | ${AUDIT} |"
            echo "| \`cargo clippy --all-targets -- -D warnings\` | ${CLIPPY} |"
            echo "| \`cargo test --all\` | ${TEST} |"
            echo "| \`trunk build\` | ${TRUNK} |"
            echo "| \`cargo tauri build --bundles deb\` | ${PACKAGE} |"
            echo
            echo "### Compiler errors (Lint step, first 30 lines)"
            echo
            echo '```'
            grep -E '^error' clippy.log | head -30 || true
            echo '```'
            echo
            echo "### Compiler errors (Test step, first 30 lines)"
            echo
            echo '```'
            grep -E '^error' test.log | head -30 || true
            echo '```'
            echo
            echo "### Failed tests (Test step, first 30 lines)"
            echo
            echo '```'
            grep -E '^test .* FAILED|^failures:$' test.log | head -30 || true
            echo '```'
            echo
            echo "Open the run log of any failed step above for the full output."
          } >> "$GITHUB_STEP_SUMMARY"

  nightly:
    name: Nightly release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages
          path: packages

      - name: Replace the assets of the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view nightly > /dev/null 2>&1; then
            gh release create nightly --prerelease \
              --title "Nightly" \
              --notes "Unsigned development build produced by CI. Not suitable for production use."
          fi
          gh release view nightly --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset nightly "$asset" --yes
          done
          cd packages
          shopt -s nullglob
          for deb in *.deb; do
            sha256sum "$deb" > "${deb}.sha256"
          done
          gh release upload nightly ./*.deb ./*.sha256 --clobber

      - name: Write job summary
        if: always()
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/nightly
        run: |
          {
            echo "## Nightly release summary"
            echo
            echo "Packages and SHA-256 checksums replaced on the nightly pre-release:"
            echo "${RELEASE_URL}"
            echo
            echo '```'
            cd packages && sha256sum ./*.deb 2> /dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tag-release:
    name: Release for a version tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages
          path: packages

      - name: Publish the pre-release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --prerelease \
              --title "${GITHUB_REF_NAME}" \
              --notes "Unsigned development build for ${GITHUB_REF_NAME}. Not suitable for production use."
          fi
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "${GITHUB_REF_NAME}" "$asset" --yes
          done
          cd packages
          shopt -s nullglob
          for deb in *.deb; do
            sha256sum "$deb" > "${deb}.sha256"
          done
          gh release upload "${GITHUB_REF_NAME}" ./*.deb ./*.sha256 --clobber

      - name: Write job summary
        if: always()
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          {
            echo "## Tag release summary"
            echo
            echo "Packages and SHA-256 checksums published for ${GITHUB_REF_NAME}:"
            echo "${RELEASE_URL}"
            echo
            echo '```'
            cd packages && sha256sum ./*.deb 2> /dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
