name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-22.04
    outputs:
      job-status: ${{ job.status }}
      fmt: ${{ steps.fmt.outcome }}
      comments: ${{ steps.comments.outcome }}
      unused: ${{ steps.unused.outcome }}
      audit: ${{ steps.audit.outcome }}
      deny: ${{ steps.deny.outcome }}
      clippy: ${{ steps.clippy.outcome }}
      test: ${{ steps.test.outcome }}
      trunk: ${{ steps.trunk.outcome }}
      package: ${{ steps.package.outcome }}
      errors: ${{ steps.errors.outputs.errors }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install Trunk and the Tauri CLI
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: trunk@0.21.14,tauri-cli@2.12.1,cargo-machete@0.9.2,cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Format check
        id: fmt
        run: cargo fmt --all --check

      - name: Check for banned comment markers
        id: comments
        run: |
          # A17 bans TODO/FIXME/XXX/HACK markers in implementation code;
          # history comments are caught by review (see docs/DECISIONS.md).
          if grep -rnE 'TODO|FIXME|XXX|HACK' --include='*.rs' crates src-tauri; then
            echo "Banned comment markers found (list above)." >&2
            exit 1
          fi

      - name: Check for unused dependencies
        id: unused
        run: cargo machete

      - name: Audit dependencies against the RustSec advisory database
        id: audit
        run: cargo audit

      - name: Check licenses, duplicate crates and dependency sources
        id: deny
        run: cargo deny check bans licenses sources

      - name: Lint
        id: clippy
        # shell: bash runs with -eo pipefail: without pipefail the `| tee` pipe
        # masked cargo's exit code and the step passed even when clippy failed
        # (observed in run 36878040457: the --locked lockfile error printed in
        # the log while the step stayed green).
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log

      - name: Test
        id: test
        shell: bash
        run: cargo test --all --locked 2>&1 | tee test.log

      - name: Frontend build
        id: trunk
        working-directory: crates/ui
        run: trunk build

      - name: Package (DEB)
        id: package
        run: cargo tauri build --bundles deb

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages
          # The cargo workspace root is the repo root, so tauri-bundler writes
          # the DEB into the workspace target directory, not src-tauri/target.
          # A single search path keeps the artifact flat after download.
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Collect compiler errors and failed tests for the report
        id: errors
        if: always()
        run: |
          {
            echo "errors<<ERRORS_EOF"
            grep -hE '^error' clippy.log test.log 2>/dev/null | head -30 || true
            grep -hE '^test .* FAILED|^failures:$' test.log 2>/dev/null | head -20 || true
            echo "ERRORS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          FMT: ${{ steps.fmt.outcome }}
          COMMENTS: ${{ steps.comments.outcome }}
          UNUSED: ${{ steps.unused.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          DENY: ${{ steps.deny.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          TRUNK: ${{ steps.trunk.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## CI build summary"
            echo
            echo "- Job status: ${JOB_STATUS}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${RUN_URL}"
            echo
            echo "| Step | Outcome |"
            echo "| ---- | ------- |"
            echo "| \`cargo fmt --all --check\` | ${FMT} |"
            echo "| banned comment markers | ${COMMENTS} |"
            echo "| unused dependencies (cargo machete) | ${UNUSED} |"
            echo "| RustSec audit (cargo audit) | ${AUDIT} |"
            echo "| licenses/duplicates/sources (cargo deny) | ${DENY} |"
            echo "| \`cargo clippy --all-targets -- -D warnings\` | ${CLIPPY} |"
            echo "| \`cargo test --all\` | ${TEST} |"
            echo "| \`trunk build\` | ${TRUNK} |"
            echo "| \`cargo tauri build --bundles deb\` | ${PACKAGE} |"
            echo
            echo "### Compiler errors (Lint step, first 30 lines)"
            echo
            echo '```'
            grep -E '^error' clippy.log | head -30 || true
            echo '```'
            echo
            echo "### Compiler errors (Test step, first 30 lines)"
            echo
            echo '```'
            grep -E '^error' test.log | head -30 || true
            echo '```'
            echo
            echo "### Failed tests (Test step, first 30 lines)"
            echo
            echo '```'
            grep -E '^test .* FAILED|^failures:$' test.log | head -30 || true
            echo '```'
            echo
            echo "Open the run log of any failed step above for the full output."
          } >> "$GITHUB_STEP_SUMMARY"

  nightly:
    name: Nightly release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages
          path: packages

      - name: Replace the assets of the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view nightly > /dev/null 2>&1; then
            gh release create nightly --prerelease \
              --title "Nightly" \
              --notes "Unsigned development build produced by CI. Not suitable for production use."
          fi
          gh release view nightly --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset nightly "$asset" --yes
          done
          cd packages
          shopt -s nullglob
          for deb in *.deb; do
            sha256sum "$deb" > "${deb}.sha256"
          done
          gh release upload nightly ./*.deb ./*.sha256 --clobber

      - name: Write job summary
        if: always()
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/nightly
        run: |
          {
            echo "## Nightly release summary"
            echo
            echo "Packages and SHA-256 checksums replaced on the nightly pre-release:"
            echo "${RELEASE_URL}"
            echo
            echo '```'
            cd packages && sha256sum ./*.deb 2> /dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tag-release:
    name: Release for a version tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages
          path: packages

      - name: Publish the pre-release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --prerelease \
              --title "${GITHUB_REF_NAME}" \
              --notes "Unsigned development build for ${GITHUB_REF_NAME}. Not suitable for production use."
          fi
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "${GITHUB_REF_NAME}" "$asset" --yes
          done
          cd packages
          shopt -s nullglob
          for deb in *.deb; do
            sha256sum "$deb" > "${deb}.sha256"
          done
          gh release upload "${GITHUB_REF_NAME}" ./*.deb ./*.sha256 --clobber

      - name: Write job summary
        if: always()
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          {
            echo "## Tag release summary"
            echo
            echo "Packages and SHA-256 checksums published for ${GITHUB_REF_NAME}:"
            echo "${RELEASE_URL}"
            echo
            echo '```'
            cd packages && sha256sum ./*.deb 2> /dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-report:
    name: CI report comment
    needs: [build, nightly, tag-release]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      # Only this job may touch the repository's issues (A19); every other
      # job stays at the workflow-level contents: read.
      issues: write
    steps:
      - name: Find or create the CI report issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list --state open --search 'CI report in:title' --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            URL=$(gh issue create --title "CI report" --body "Concise CI reports are posted here for every run (docs/SPEC-AMENDMENTS.md, A19).")
            NUMBER=$(basename "$URL")
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Post the report comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ needs.build.outputs.job-status }}
          NIGHTLY: ${{ needs.nightly.result }}
          TAG_RELEASE: ${{ needs.tag-release.result }}
          FMT: ${{ needs.build.outputs.fmt }}
          COMMENTS: ${{ needs.build.outputs.comments }}
          UNUSED: ${{ needs.build.outputs.unused }}
          AUDIT: ${{ needs.build.outputs.audit }}
          DENY: ${{ needs.build.outputs.deny }}
          CLIPPY: ${{ needs.build.outputs.clippy }}
          TEST: ${{ needs.build.outputs.test }}
          TRUNK: ${{ needs.build.outputs.trunk }}
          PACKAGE: ${{ needs.build.outputs.package }}
          ERRORS: ${{ needs.build.outputs.errors }}
        run: |
          {
            echo "## CI report - ${GITHUB_SHA:0:8} on ${GITHUB_REF_NAME}"
            echo
            echo "Run: ${RUN_URL} - build job: ${JOB_STATUS}, nightly release: ${NIGHTLY}, tag release: ${TAG_RELEASE}"
            echo
            echo "| Step | Outcome |"
            echo "| ---- | ------- |"
            echo "| \`cargo fmt --all --check\` | ${FMT} |"
            echo "| banned comment markers | ${COMMENTS} |"
            echo "| unused dependencies (cargo machete) | ${UNUSED} |"
            echo "| RustSec audit (cargo audit) | ${AUDIT} |"
            echo "| licenses/duplicates/sources (cargo deny) | ${DENY} |"
            echo "| \`cargo clippy --all-targets -- -D warnings\` | ${CLIPPY} |"
            echo "| \`cargo test --all\` | ${TEST} |"
            echo "| \`trunk build\` | ${TRUNK} |"
            echo "| \`cargo tauri build --bundles deb\` | ${PACKAGE} |"
            echo
            echo "### Errors and failed tests (first lines)"
            echo
            echo '```'
            if [ -n "${ERRORS}" ]; then
              printf '%s\n' "${ERRORS}"
            else
              echo "(none)"
            fi
            echo '```'
          } > report.md
          gh issue comment "$ISSUE" --body-file report.md

      - name: Write job summary
        if: always()
        env:
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.issue.outputs.number }}
        run: |
          {
            echo "## CI report summary"
            echo
            echo "The report comment was posted to: ${ISSUE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
