[package]
name = "supportos-oracle-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Pure-Rust core of SupportOS Oracle: domain, persistence, services, jobs and
# business logic. This crate must not depend on Tauri or GTK so its tests run
# without Linux GUI system libraries (docs/SPEC-AMENDMENTS.md, A5).
#
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
thiserror = "2"
log = "0.4"
# The bundled feature compiles the vendored SQLite with FTS5 enabled (the
# libsqlite3-sys build defines SQLITE_ENABLE_FTS5, verified in its build.rs),
# so no system SQLite is required on build or target machines.
rusqlite = { version = "0.40", features = ["bundled"] }
