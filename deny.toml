# cargo-deny configuration (schema 2). Checks run in CI as
# `cargo deny check bans licenses sources` — advisories are covered by the
# dedicated `cargo audit` step, so they are not repeated here.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/

[bans]
# The Tauri 2 dependency tree carries several unavoidable duplicate versions.
# Duplicates surface as warnings: visible in the run log without failing CI.
multiple-versions = "warn"

[licenses]
version = 2
# Exactly the licenses present in the current leptos/tauri/rusqlite tree:
# cargo-deny warns about allow entries that never occur, so this list stays
# trimmed to reality and any NEW license entering the tree fails the check
# for an explicit review rather than slipping through.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
# Registry crates must come from crates.io; no unvetted registries or git
# dependencies are allowed.
unknown-registry = "deny"
unknown-git = "deny"
